name: Verify D08 certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned exact math dependency
        run: python -m pip install sympy==1.14.0
      - name: Exact geometry and spectrum
        run: python src/verify_d08.py
      - name: Independent rational certificate
        run: python tests/independent_d08.py
